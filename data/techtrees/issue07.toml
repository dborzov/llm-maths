caption = """Arrows point <em>upward</em> from prerequisite to dependent. Read the cold-open (<a href="01-cold-open/">ch.1</a>) first — it sets the mystery. The mainline tracks DeepSeek's attention timeline left-to-right: MLA (May 2024) → the quadratic compute wall MLA didn't solve → a decade of failed sparse-attention attempts → the NSA blueprint (Feb 2025) → the Lightning Indexer / DSA shipped in V3.2-Exp (Sept 2025) → CSA and HCA, the two attention modes V4 interleaves. Theory primers (bottom row) underwrite the mainline; applied primers (middle row) describe reusable techniques that recur across NSA, DSA, CSA, and HCA."""
