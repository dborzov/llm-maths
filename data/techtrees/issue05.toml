caption = 'Arrows point <em>upward</em> from prerequisite to user. Read the cold-open (<a href="01-cold-open/">ch.1</a>) first — it introduces the 60-line listing this whole tree unpacks. The bottom row (<a href="02-state-dict/">state dict</a> + <a href="04-linear/">linear</a>) is the bedrock; everything else hangs off it. The capstone (<a href="16-full-forward/">ch.16</a>) re-prints the listing with every line annotated. The top row is the <strong>architecture variants wing</strong> — the four families of KV-cache-shrinking modifications (GQA, MLA, sliding-window, SSM-hybrids) that became mainstream in 2023–2025, framed by <a href="17-kv-axes/">ch.17</a>.'
