[[events]]
date  = "Mar 2023"
title = "Hopper FP8 ships"
who   = "NVIDIA H100"
body  = "First mainstream silicon with native FP8 E4M3 + E5M2 tensor cores. Documented FP32 accumulation. Software has somewhere to land."
kind  = "hardware"
