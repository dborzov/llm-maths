baseURL = "https://borzov.ca/llm-maths/"
languageCode = "en-us"
title = "Borzov's LLM Maths"
theme = "almanac"

enableGitInfo = true
buildFuture = true

[taxonomies]
  tag = "tags"
  topic = "topics"

[markup]
  defaultMarkdownHandler = "goldmark"

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block  = [["$$", "$$"]]
          inline = [["$", "$"]]

  [markup.highlight]
    style          = "monokai"
    noClasses      = true
    lineNos        = false
    tabWidth       = 4
    codeFences     = true

  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page    = ["HTML"]

[sitemap]
  changefreq = "weekly"
  priority   = 0.5

[params]
  description  = "Long-form articles on the maths behind LLMs — written to build real intuition, not just surface-level familiarity."
  author       = "borzov.ca"
  githubRepo   = "https://github.com/dborzov/llm-maths"
  katexVersion = "0.16.11"
  defaultTheme = "cream"
