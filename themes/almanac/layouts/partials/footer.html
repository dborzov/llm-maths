<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img src="{{ "logo-64.png" | relURL }}" alt="LLM Maths" class="footer-sigil">
      <p>Borzov's LLM Maths</p>
      <p class="footer-sub">Open source. No corporate fluff. Just maths.</p>
    </div>
    <div class="footer-links">
      {{- with site.GetPage "/comicbook" }}<a href="{{ .RelPermalink }}">Comic Books</a>{{ end }}
      {{- with site.GetPage "/wiki" }}<a href="{{ .RelPermalink }}">Wiki</a>{{ end }}
      <a href="{{ site.Params.githubRepo }}" target="_blank" rel="noopener">GitHub ↗</a>
    </div>
  </div>
</footer>
